name: Milestone Autopilot

on:
  workflow_dispatch:
    inputs:
      milestone:
        description: "Numeric GitHub milestone ID"
        required: true
        type: number

# Only manually dispatched runs. Continuations use an authenticated workflow_dispatch.
concurrency:
  group: milestone-autopilot-${{ inputs.milestone }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deliver:
    runs-on: [self-hosted, commerce-lab-autopilot]
    timeout-minutes: 330
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          npm install --global 'opencode-ai@^1'

      - name: Verify OpenCode Codex OAuth
        run: |
          if ! opencode auth list | grep -q 'OpenAI.*oauth'; then
            echo "OpenCode has no persistent OpenAI OAuth login. Run 'opencode auth login' as the runner user."
            exit 1
          fi

      - name: Test scheduling and quality gates
        run: pnpm exec vitest run scripts/autopilot-core.test.mjs

      - name: Process one issue and queue next iteration
        env:
          AUTOPILOT_GH_TOKEN: ${{ secrets.AUTOPILOT_GH_TOKEN }}
          AUTOPILOT_MODEL: ${{ vars.AUTOPILOT_MODEL }}
          AUTOPILOT_REVIEW_MODEL: ${{ vars.AUTOPILOT_REVIEW_MODEL }}
        run: node scripts/autopilot.mjs "${{ inputs.milestone }}"
